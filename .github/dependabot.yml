# Dependabot reads this file from the default branch (main).
# Options: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "npm"
    # https://docs.github.com/en/code-security/reference/supply-chain-security/dependabot-options-reference?versionId=free-pro-team%40latest&productId=code-security&restPage=tutorials%2Csecure-your-dependencies%2Cdependabot-quickstart#cooldown-
    cooldown:
      default-days: 7
      semver-major-days: 30
      semver-minor-days: 7
      semver-patch-days: 7
    directory: "/"
    schedule:
      interval: "weekly"
    # One pull request a week for all minor and patch updates. Each major
    # version still gets its own, since those are the ones that break. An
    # Astro update fails CI until patches/ is updated for it; that is the
    # reminder to do so.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]

  # Keep the pinned actions in .github/workflows current.
  # Tells dependabot to check for updates to GitHub Actions used in workflows. This is important because GitHub Actions can have security vulnerabilities, and keeping them up to date helps mitigate those risks.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
