# Dependabot reads this file from the default branch (main).
# Options: https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    # One pull request a week for all minor and patch updates. Each major
    # version still gets its own, since those are the ones that break. An
    # Astro update fails CI until patches/ is updated for it; that is the
    # reminder to do so.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
  # Keep the pinned actions in .github/workflows current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
